name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs need real services. The suite cannot run at all without PostgreSQL, and
# Redis is still required because tasks are not forced eager -- a test that calls
# `.delay()` fails against an unreachable broker. Stubbing either service would
# reproduce the exact blind spot this workflow exists to close.
#
# Redis used to matter for a second reason: 93 of the 109 test failures once found in
# this repository were throttle-cache errors from an unreachable Redis. DRF throttling
# was removed in v0.1.17, so that failure mode no longer exists and the broker is the
# only thing left depending on the service.
#
# The non-obvious requirement is the discovery floor in each job. Bare
# `python manage.py test` once discovered ZERO tests and exited 0, because apps/ was a
# PEP 420 namespace package and every test module's relative imports failed. The suite
# reported success while checking nothing, and 109 failures stayed invisible. A workflow
# that only checks the exit code would have gone green the whole time. Both jobs
# therefore assert a minimum test count as well as a green result.

jobs:
  backend:
    name: Django checks and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: finance_analysis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # `config.settings.test` moves the cache and the channel layer in-process, so
      # this Redis exists only for `CELERY_BROKER_URL`: tasks are not forced eager,
      # and a test that calls `.delay()` would otherwise fail on the connection.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV_FILE: "False"
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/finance_analysis
      # Stock redis:7 needs no credentials. The development server does -- it uses an
      # ACL user, and the password-only and default-user URL forms both fail against it
      # -- but that is a property of that server's configuration, not of this code.
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      # Raise this when tests are added. Lowering it should require a reason, because
      # the only way the count drops is discovery breaking or tests being deleted.
      # 421 -> 361: the authentication module was removed in v0.1.17, and the 60
      # deleted tests were its permission gates, credential storage and API-key
      # behaviour. Two replaced what they covered: alert notification dispatch
      # (email recipients + the `alerts` group_send) and the un-gated screener
      # catalogue.
      # 361 -> 362: the no-recipients case, which is the one silent behaviour change
      # of settings-driven alerting and had nothing asserting it.
      # 362 -> 447: the cold page-load work. Eight stored-candidate ranking
      # tests, three no-request-time-inference guards, two indicator-window and
      # SQL-pagination guards, and the harness-coverage drift guard that derives
      # required coverage from frontend/src.
      # 447 -> 450: the two guards that keep the browser pass honest -- every route
      # in App.tsx must appear in measure_browser_time_to_data.sh, and every page
      # that reads the API must register with the time-to-data instrument (the hole
      # that left Stock Detail and Backtest unmeasurable) -- plus the factors
      # macro-context re-score test, which pins that the SQL annotation still equals
      # the same weighted sum done in Decimal.
      # 450 -> 465: the ETF rotation follow-on. Six tests either side of the new
      # `activate: bool` seam in both trainers -- a suppressed trial must not flip
      # the incumbent of its own type or of another, the default must still take
      # over, `train_walk_forward` must actually thread the flag, and the sweep
      # provenance metadata must persist. Nine more for the ETF comparison payload:
      # rescaling onto opening equity, filling a benchmark-feed hole so both curves
      # share one session grid, secondary codes and their labels, the two
      # short-circuit messages, overlay parsing, and that an overlay request is
      # never served the cached body of a bare one.
      # Discovery is verified at 465, so nothing is silently missing.
      # 465 -> 514: the ETF backtest write API. Forty-nine tests, and the four
      # classes add up exactly: 18 create guardrails (RULE-only is enforced
      # server-side, date sanity, fingerprint dedupe against an in-flight row, the
      # ETF_MAX_CONCURRENT_BACKTESTS cap answering 429), 15 lifecycle transitions
      # (pause on PENDING is immediate while pause on RUNNING only sets
      # pending_control_action, resume rejects a row that is not PAUSED with the
      # server's own sentence, restart discards runtime_state), 7 chunk-boundary
      # controls proving the engine acts on a request rather than ignoring it, and
      # 9 task-lifecycle tests that the queue is reached through
      # transaction.on_commit and that a stale task owner is recognised now that
      # current_task_id exists. Discovery is verified at 514.
      # 514 -> 549: the LSTM sweep. Thirty-five tests in two classes: 10 over the
      # grid and its fingerprint (the 32-combination product, the loss axis really
      # being train_lstm's own constants, exact trial names, and a digest that
      # changes with the window or any protocol knob so a resumed sweep can never
      # reuse an incomparable row), and 25 that drive the command against a
      # torch-free stub trainer -- every trial registers with activate=False and
      # carries tuning metadata but never pooled_holdout, the incumbent survives
      # both a clean and a mid-sweep-failed run, one failed trial does not cost
      # the rest, --force and a stale fingerprint re-run while a fresh COMPLETED
      # row is skipped, the holdout is refused unless explicitly overridden, and
      # --plan/--dry-run touch neither torch nor the database.
      # 549 -> 614: selection, sizing and signal transparency. Sixty-five tests in
      # seventeen classes, and the groups add up exactly: selection (5 over the
      # seven tracked-index spellings, 2 fund-size estimates, 2 money-tier
      # classifications, 7 dedup + max-per-category constraints, 2 the
      # score -> shares -> ticker tie-break, 4 grid resume keys); sizing (6
      # inverse-volatility incl. the "every mode spends exactly its budget"
      # invariant, 8 the walk-forward Kelly governor, 3 payoff_ratio, 4 cash-yield
      # accrual, 2 that all four weighting choice lists agree); plumbing (3 that
      # every CLI knob reaches the engine in a form it accepts -- the TypeError
      # class of bug -- and 6 refusing to persist a signal whose cross-section was
      # blind); API surface (4 defensive-sleeve validation, 2 the tradable-sleeve
      # list, 2 the config-derived RULE tag, 3 the freshness endpoint).
      MIN_TEST_COUNT: "614"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the verified local interpreter. TA-Lib >= 0.6 ships manylinux
          # wheels that bundle the C library, so no apt build step is needed.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt
        # torch is unpinned and large; expect this step to dominate the job runtime.

      - name: Django system checks
        run: python manage.py check

      - name: No unrecorded model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Generated reference sheets are current
        run: python manage.py export_documentation_facts --check

      - name: Page-load budget guards
        run: |
          # Runs before the full suite on purpose: these are the two invariants the
          # 3-second cold budget rests on, and they take seconds rather than the
          # several minutes the suite takes.
          #
          # 1. No request-time inference. The dashboard and the three prediction
          #    stock endpoints may read stored rows, queue a Celery task, or return
          #    empty with `generation.status` saying which. They may not compute a
          #    prediction on the request thread -- that is what made a cold
          #    Dashboard take 45s and a cold Stock Detail minutes.
          # 2. Harness coverage. scripts/measure_page_api_latency.sh is the only
          #    evidence behind the budget, and it went stale for a whole release
          #    once already, timing a seven-call bundle that no page sends any more.
          #    This derives the required coverage from frontend/src, so a new
          #    page-load call that is not measured fails CI instead of going
          #    unmeasured.
          python manage.py test \
            apps.analytics.tests.DashboardStocksCacheTests \
            apps.analytics.tests.Phase17DashboardStockApiTests \
            apps.prediction.tests.PredictionEndpointInferenceGuardTests \
            apps.core.tests_frontend.PageLoadLatencyHarnessTests \
            --noinput -v 2

      - name: Test suite, with a discovery floor
        run: |
          # --noinput so the runner never prompts about an existing test database.
          # No --keepdb: the service container is ephemeral, and creating the database
          # from scratch is the honest check that migrations still work.
          #
          # Django writes its summary to stderr, hence 2>&1. The `|| true` keeps a
          # failing suite from aborting this step before the floor check runs, so the
          # diagnostic below is always reported rather than only the raw failure.
          python manage.py test --noinput 2>&1 | tee test-output.txt || true

          count=$(grep -oE '^Ran [0-9]+' test-output.txt | grep -oE '[0-9]+' | head -n1)
          echo "Discovered ${count:-0} tests; floor is $MIN_TEST_COUNT."

          if [ -z "$count" ] || [ "$count" -lt "$MIN_TEST_COUNT" ]; then
            echo "::error::Test discovery regression: ${count:-0} tests found, floor is $MIN_TEST_COUNT."
            echo "apps/__init__.py is what makes discovery work. Without it, apps/ is a"
            echo "PEP 420 namespace package, every test module's relative imports fail,"
            echo "and 'manage.py test' exits 0 having run nothing."
            exit 1
          fi

          if grep -qE '^(FAILED|ERROR:|FAIL:)' test-output.txt; then
            echo "::error::Suite reported failures; see the log above."
            exit 1
          fi

          if ! grep -qE '^OK' test-output.txt; then
            echo "::error::No 'OK' summary line; the runner did not complete."
            exit 1
          fi

          echo "Suite green: $count tests."

  frontend:
    name: Frontend tests, type-check, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # 48 -> 42: eight credential-storage tests and one per-page auth-gate test
      # went with the auth module; three transport tests replaced them (no
      # credential headers, no `credentials`, and apiDelete's 204/empty-body
      # paths).
      # 42 -> 45: three tests for useAlertsSocket, which had none. Removing the
      # credential check that suppressed reconnects is invisible to every other
      # test in the suite, so the reconnect behaviour is now asserted directly:
      # bare URL with no token, reconnect after a close, and the backoff cap
      # followed by giving up. Measured by `npm test`: 45 passed across 6 files.
      # 45 -> 51: the time-to-data instrument, which is the only source of the
      # browser term of the 3s page budget and therefore of FRONTEND_OVERHEAD_SECONDS.
      # Six tests in src/hooks/useApiResource.test.tsx: the stamp waits for the last
      # first value rather than the first; a failed resource releases it anyway;
      # data-tti survives an engine with no usable performance.measure (jsdom ships
      # none); a resource mounted after the first quiet moment reopens the view
      # instead of being ignored; the open offset and the wait are recorded
      # separately so the round trip is not billed twice; and trackViewResource --
      # the registering half of the hook, used by the two pages that compose their
      # requests by hand -- stamps too. Measured by `npm test`: 51 across 7 files.
      # 51 -> 54: Stock Detail's queued-generation refresh, in a new
      # src/pages/StockDetailPage.test.tsx. The page tells the user generation is
      # queued and will appear shortly, which is a promise only a re-read can keep
      # -- the task writes rows, it does not push them -- so the three tests are
      # that the poll exists and fills the rows in, that an 'unavailable' queue is
      # not polled (retrying a down broker is not the fix), and that the wait is
      # capped at twelve ticks rather than running forever. Measured by `npm test`:
      # 54 across 8 files.
      # 54 -> 58: the ETF rotation dashboard, in a new
      # src/pages/EtfRotationPage.test.tsx. Every ETF metric crosses the wire as a
      # fraction, so the four tests are that percentages are built from those
      # fractions and not pre-multiplied, that the alpha-leading run is plotted
      # against its benchmark without a click, that a 404 from
      # /etf/signals/latest/ becomes an empty state rather than an error, and that
      # the universe tab asks the server for rankable rows only. Measured by
      # `npm test`: 58 across 9 files.
      # 58 -> 66: the ETF backtest workbench, in a new
      # src/pages/EtfBacktestWorkbenchPage.test.tsx. Eight tests, and each one is
      # the client refusing to be more optimistic than the server: a create that
      # answers 202 says "queued" rather than "done", a 429 or a 400 surfaces the
      # server's own sentence instead of "request failed", progress comes from the
      # detail retrieve because the list projection has no report at all, the 5s
      # poll stops on a terminal status and its timer is cleared on unmount, and
      # pause/resume/restart/delete are enabled only in the states that allow them.
      # Measured by `npm test`: 72 across 10 files (66 -> 72: four on the signal
      # card -- the as-of date kept apart from the generated/updated timestamps, a
      # dash instead of a guess when a row has no write timestamps, the banner when
      # the newest snapshot is ahead of the signal, and a config panel that renders
      # a knob the frontend has never heard of -- and two on the workbench, listing
      # each money-market sleeve with its 20-day turnover and staying typeable
      # when that list cannot be loaded).
      MIN_TEST_COUNT: "72"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both steps go through a ratchet instead of calling the npm scripts directly.
      # frontend/scripts/check-static-baseline.mjs runs the command, parses its
      # diagnostics and compares them against frontend/static-baseline.json, failing only
      # on something beyond what is recorded.
      #
      # The recorded baseline is zero TypeScript errors and zero ESLint errors, so the
      # type-check is exactly as strict as the bare `npm run build` this replaces. The
      # part that was ungated is the nine react-hooks/exhaustive-deps warnings: eslint
      # exits 0 with all nine present because nothing passes --max-warnings, so a tenth
      # would have arrived silently. It cannot now.
      #
      # The build gate clears tsc's incremental .tsbuildinfo before running. A warm
      # `tsc --build` can skip a project it considers up to date, or replay diagnostics
      # recorded against an older revision of the source -- it once reported six errors
      # this tree did not have. A cold run is the only honest measurement, and it is what
      # `npm ci` above gives this job anyway.
      #
      # Clear the nine warnings and the ratchet is pure overhead: delete the script and
      # the baseline file, and put `npm run build` and `npm run lint` back here.
      - name: Type-check and build
        run: node scripts/check-static-baseline.mjs build

      - name: Lint
        run: node scripts/check-static-baseline.mjs lint

      - name: Unit tests, with a discovery floor
        run: |
          # vitest transpiles without type-checking, so a green run here says nothing
          # about whether the project compiles. That is why the type-check step above
          # exists, and why this floor matters: vitest would also exit 0 having
          # matched no test files.
          npm test 2>&1 | tee test-output-raw.txt || true

          # Strip ANSI color codes so grep patterns match reliably.
          sed 's/\x1b\[[0-9;]*m//g' test-output-raw.txt > test-output.txt

          count=$(grep -oE 'Tests +[0-9]+ passed' test-output.txt | grep -oE '[0-9]+' | head -n1)
          echo "Discovered ${count:-0} tests; floor is $MIN_TEST_COUNT."

          if [ -z "$count" ] || [ "$count" -lt "$MIN_TEST_COUNT" ]; then
            echo "::error::Test discovery regression: ${count:-0} tests found, floor is $MIN_TEST_COUNT."
            exit 1
          fi

          if grep -qE 'Tests +[0-9]+ failed|Test Files +[0-9]+ failed' test-output.txt; then
            echo "::error::Frontend suite reported failures; see the log above."
            exit 1
          fi

          echo "Frontend suite green: $count tests."
