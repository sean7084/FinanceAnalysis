services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: finance_analysis_django
    container_name: finance_analysis_django
    volumes:
      - .:/app
      # Anonymous volume that preserves the frontend/dist directory baked into
      # the image by the `frontend-build` stage. Without it, the `.:/app`
      # bind-mount above would expose the host's frontend/dist (typically
      # empty because it is gitignored) and shadow the built SPA assets.
      - /app/frontend/dist
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    command: /start

  celery_worker:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: finance_analysis_django
    container_name: finance_analysis_celery_worker
    volumes:
      - .:/app
    env_file:
      - ./.env
    command: /start-celeryworker

  celery_beat:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: finance_analysis_django
    container_name: finance_analysis_celery_beat
    volumes:
      - .:/app
    env_file:
      - ./.env
    command: /start-celerybeat
