[project]
name = "finance-analysis"
version = "0.1.53"
description = "Chinese A-share and ETF quantitative analysis platform."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

# The version above is the single source. config/settings/base.py reads it for
# SPECTACULAR_SETTINGS['VERSION'], and apps/core/tests_version.py fails if the CHANGELOG
# heading or frontend/package.json disagrees with it.
#
# Before this file existed there were three numbers that cross-referenced nothing:
# OpenAPI reported 0.2.0, the CHANGELOG's newest heading said 0.1.53, and the frontend
# package said 0.0.0. The OpenAPI one had been lowered from 1.2.0 to 0.2.0 when the
# authentication module was removed -- a breaking schema change -- which narrowed the gap
# without closing it.
#
# No [build-system] on purpose: this project is deployed from a checkout with
# requirements/*.txt, not built into a distribution. The table exists to own the version
# and to give the dependency tooling somewhere to live.
